[workspace]
members = [
    "aion-types",
    "aion-memory",
    "aion-intel",
    "aion-router",
    "aion-forge-cli",
    "aion-server",
    "aion-sandbox",
    "aion-forge-cli-gen",
    "aion-zl",
    "aion-forge-acp",
    "crates/glitch-filter",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
chrono = { version = "0.4", features = ["serde"] }
rayon = "1"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
async-nats = "0.50"
futures-util = "0.3"
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "trace"] }
async-trait = "0.1"
regex = "1"
metrics = "0.24"
flate2 = "1"
glitch-filter = { path = "crates/glitch-filter" }
metrics-exporter-prometheus = "0.16"
indicatif = "0.17"
jsonschema = "0.18"
agent-client-protocol = "1.3.0"
# ── Upgrade P1/P2: replace hand-written builtins (2026-08-01) ──
yaml-rust2 = "0.11"
toml = "1.1"
csv = "1.4"
pdf-extract = "0.12"
pulldown-cmark = "0.13"
similar = "3.1"
jsonpath-rust = "1.0"
redb = "4.1"
usearch = { version = "2.26", default-features = false }
# ── Upgrade P3/P5: protocols + server (2026-08-01, round 2) ──
rmcp = { version = "3.1", features = ["client", "server", "transport-io"] }

[workspace.lints.clippy]
all = "warn"
