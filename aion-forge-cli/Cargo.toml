[package]
name = "aion-forge-cli"
version = "0.7.0"
edition = "2021"
authors = ["AionCore Team"]
description = "Standalone command-line and MCP entrypoint for Aion Forge"

[dependencies]
aion-intel = { path = "../aion-intel" }
aion-router = { path = "../aion-router" }
aion-types = { path = "../aion-types" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
glitch-filter = { path = "../crates/glitch-filter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
