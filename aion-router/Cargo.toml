[package]
name = "aion-router"
version = "0.1.0"
edition = "2021"

[features]
default = ["local"]
local = []
distributed = ["async-nats", "axum", "tower-http", "futures-util"]

[dependencies]
aion-types = { path = "../aion-types" }
aion-memory = { path = "../aion-memory" }
aion-intel = { path = "../aion-intel" }
aion-sandbox = { path = "../aion-sandbox" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
rayon = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
metrics = { workspace = true }
flate2 = { workspace = true }
glitch-filter = { workspace = true }
jsonschema = { workspace = true }
yaml-rust2 = { workspace = true }
toml = { workspace = true }
csv = { workspace = true }
pdf-extract = { workspace = true }
pulldown-cmark = { workspace = true }
similar = { workspace = true }
jsonpath-rust = { workspace = true }

# D1: distributed mode dependencies (feature-gated)
async-nats = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

# MCP client (rmcp 3.1，替换手写 JSON-RPC over stdio)
# 说明（升级依据：docs.rs/rmcp/3.1.0）：
# - workspace 已声明 features = ["client","server","transport-io"]（server 端 stdio）。
#   client 端 stdio 需要额外的 transport-child-process；streamable HTTP client（SSE 替代）
#   需要 transport-streamable-http-client-reqwest。member 声明的 features 与 workspace
#   声明的 features 取并集，不会覆盖。
rmcp = { workspace = true, features = ["transport-child-process", "transport-streamable-http-client-reqwest"] }
